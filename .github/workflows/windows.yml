name: Compilar WORLD CREW v0.2 para Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -r WORLD_CREW_V02/requirements.txt
      - name: Crear ejecutable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name WorldCrew --add-data "WORLD_CREW_V02/assets;assets" WORLD_CREW_V02/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: WORLD-CREW-Windows-v02
          path: dist/WorldCrew.exe
