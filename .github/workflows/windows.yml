
name: Compilar WORLD CREW v0.3 para Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r WORLD_CREW_V03/requirements.txt
          pip install pyinstaller

      - name: Crear ejecutable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name WorldCrew --add-data "WORLD_CREW_V03/assets;assets" WORLD_CREW_V03/main.py

      - name: Subir ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: WORLD-CREW-Windows-v03
          path: dist/WorldCrew.exe
