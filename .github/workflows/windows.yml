name: Compilar WORLD CREW v0.4 para Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r WORLD_CREW_V04/requirements.txt
          pip install pyinstaller
      - name: Compilar
        run: pyinstaller --noconfirm --clean --onefile --windowed --name WorldCrew --add-data "WORLD_CREW_V04/assets;assets" WORLD_CREW_V04/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: WORLD-CREW-Windows-v04
          path: dist/WorldCrew.exe
